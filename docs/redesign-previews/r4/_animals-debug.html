<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r4 · animals debug (not linked from the site)</title>
<style>
  :root {
    --bg:#121016; --cat:#3A3344; --muted:#9B939E; --accent:#F5A742; --line:#2B2634;
    --text:#EDE7DF; --mono: ui-monospace, Menlo, monospace;
  }
  body { margin:0; background:var(--bg); color:var(--muted); font: 11px/1.4 var(--mono); }
  h2 { margin: 0 0 8px; font: 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .cols { display:flex; gap: 24px; align-items:flex-start; padding: 14px; }
  .col { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; }
  .row .label { width:90px; flex: 0 0 90px; }
  canvas.tile { display:block; background:var(--bg); border:1px solid var(--line); }
  .strip { display:flex; flex-wrap:wrap; gap:10px; padding: 14px; }
  .strip .cell { display:flex; flex-direction:column; gap:4px; }
  .section { padding: 0 14px 14px; }
</style>
</head>
<body>
<div id="out"></div>

<script src="critters.js"></script>
<script src="walker.js"></script>
<script>
(function () {
  var out = document.getElementById('out');

  function groundLine(ctx, w, gy) {
    ctx.save();
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || '#2B2634';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, gy + 0.5);
    ctx.lineTo(w, gy + 0.5);
    ctx.stroke();
    ctx.restore();
  }

  function makeTile(size, gy, draw) {
    var c = document.createElement('canvas');
    c.className = 'tile';
    c.width = size; c.height = size === 110 ? 64 : (size === 220 ? 128 : 236);
    var ctx = c.getContext('2d');
    groundLine(ctx, c.width, gy);
    draw(ctx, c.width / 2, gy);
    return c;
  }

  // ---- renderers ----------------------------------------------------

  function drawCritter(ctx, kind, state, t, x, gy, dir, z) {
    ctx.save();
    ctx.scale(z, z);
    window.Critters.renderAt(ctx, kind, state, t, x / z, gy / z, dir || 1);
    ctx.restore();
  }

  function drawWalker(ctx, state, t, x, gy, dir, z) {
    if (!(window.Walker && Walker.renderAt)) return false;
    ctx.save();
    ctx.scale(z, z);
    Walker.renderAt(ctx, state, t, x / z, gy / z, dir || 1);
    ctx.restore();
    return true;
  }

  // ---- poses view -----------------------------------------------------

  function posesTileSet(x, gy, drawFn) {
    var t1 = makeTile(110, 58, function (ctx, cx, gy1) { drawFn(ctx, cx, gy1, 1); });
    var t2 = makeTile(220, 116, function (ctx, cx, gy1) { drawFn(ctx, cx, gy1, 2); });
    var t4 = makeTile(340, 220, function (ctx, cx, gy1) { drawFn(ctx, cx, gy1, 4); });
    return [t1, t2, t4];
  }

  function posesRow(label, drawFn) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = label;
    row.appendChild(lab);
    posesTileSet(0, 0, drawFn).forEach(function (t) { row.appendChild(t); });
    return row;
  }

  function critterRow(kind, label, state, t, dir) {
    return posesRow(label, function (ctx, cx, gy, z) {
      drawCritter(ctx, kind, state, t, cx, gy, dir, z);
    });
  }

  function walkerRow(label, state, t, dir) {
    return posesRow(label, function (ctx, cx, gy, z) {
      var ok = drawWalker(ctx, state, t, cx, gy, dir, z);
      if (!ok) {
        // leave tile empty, label already present in row label cell
      }
    });
  }

  function renderPoses() {
    var cols = document.createElement('div');
    cols.className = 'cols';
    out.appendChild(cols);

    // deer
    var deerCol = document.createElement('div'); deerCol.className = 'col';
    var deerH = document.createElement('h2'); deerH.textContent = 'DEER'; deerCol.appendChild(deerH);
    deerCol.appendChild(critterRow('deer', 'walk 0 (contact)', 'walk', 0, 1));
    deerCol.appendChild(critterRow('deer', 'walk 0.125 (passing)', 'walk', 0.125, 1));
    deerCol.appendChild(critterRow('deer', 'graze', 'graze', 1, 1));
    deerCol.appendChild(critterRow('deer', 'stare', 'stare', 1, 1));
    deerCol.appendChild(critterRow('deer', 'pause', 'pause', 0.3, 1));
    deerCol.appendChild(critterRow('deer', 'look 0.5', 'look', 0.5, 1));
    deerCol.appendChild(critterRow('deer', 'facing left', 'walk', 0, -1));
    cols.appendChild(deerCol);

    // raccoon
    var raccCol = document.createElement('div'); raccCol.className = 'col';
    var raccH = document.createElement('h2'); raccH.textContent = 'RACCOON'; raccCol.appendChild(raccH);
    raccCol.appendChild(critterRow('raccoon', 'walk 0', 'walk', 0, 1));
    raccCol.appendChild(critterRow('raccoon', 'walk 0.125', 'walk', 0.125, 1));
    raccCol.appendChild(critterRow('raccoon', 'rummage', 'rummage', 0.3, 1));
    raccCol.appendChild(critterRow('raccoon', 'sit-up', 'situp', 1, 1));
    raccCol.appendChild(critterRow('raccoon', 'hold', 'hold', 1, 1));
    raccCol.appendChild(critterRow('raccoon', 'carry', 'carry', 0, 1));
    raccCol.appendChild(critterRow('raccoon', 'sit 0.5', 'sit', 0.5, 1));
    cols.appendChild(raccCol);

    // cat
    var catCol = document.createElement('div'); catCol.className = 'col';
    var catH = document.createElement('h2'); catH.textContent = 'CAT'; catCol.appendChild(catH);
    catCol.appendChild(walkerRow('walk 0', 'walk', 0, 1));
    catCol.appendChild(walkerRow('walk 0.125', 'walk', 0.125, 1));
    catCol.appendChild(walkerRow('sit', 'sit', 1, 1));
    catCol.appendChild(walkerRow('look', 'look', 1, 1));
    catCol.appendChild(walkerRow('groom', 'groom', 0.5, 1));
    catCol.appendChild(walkerRow('stretch', 'stretch', 0.4, 1));
    catCol.appendChild(walkerRow('lie', 'lie', 1, 1));
    catCol.appendChild(walkerRow('facing left', 'walk', 0, -1));
    cols.appendChild(catCol);
  }

  // ---- film view --------------------------------------------------------

  function filmCell(label, drawFn) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    var c = makeTile(220, 116, drawFn);
    var b = document.createElement('div');
    b.textContent = label;
    cell.appendChild(c);
    cell.appendChild(b);
    return cell;
  }

  function filmSection(title, cells) {
    var h = document.createElement('h2');
    h.textContent = title;
    var wrap = document.createElement('div');
    wrap.className = 'section';
    wrap.appendChild(h);
    var strip = document.createElement('div');
    strip.className = 'strip';
    cells.forEach(function (c) { strip.appendChild(c); });
    wrap.appendChild(strip);
    return wrap;
  }

  function renderFilm() {
    // deer
    var deerWalk = [];
    for (var i = 0; i < 8; i++) {
      (function (i) {
        deerWalk.push(filmCell('walk ' + i + '/8', function (ctx, cx, gy) {
          drawCritter(ctx, 'deer', 'walk', i / 8, cx, gy, 1, 2);
        }));
      })(i);
    }
    out.appendChild(filmSection('DEER', deerWalk));

    var deerGraze = [];
    [0, .2, .4, .6, .8, 1].forEach(function (t) {
      deerGraze.push(filmCell('graze t=' + t, function (ctx, cx, gy) {
        drawCritter(ctx, 'deer', 'graze', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('DEER — graze transition', deerGraze));

    var deerLook = [];
    [0, .2, .4, .6, .8, 1].forEach(function (t) {
      deerLook.push(filmCell('look t=' + t, function (ctx, cx, gy) {
        drawCritter(ctx, 'deer', 'look', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('DEER — look transition', deerLook));

    // raccoon
    var raccWalk = [];
    for (var j = 0; j < 8; j++) {
      (function (j) {
        raccWalk.push(filmCell('walk ' + j + '/8', function (ctx, cx, gy) {
          drawCritter(ctx, 'raccoon', 'walk', j / 8, cx, gy, 1, 2);
        }));
      })(j);
    }
    out.appendChild(filmSection('RACCOON', raccWalk));

    var raccSit = [];
    [0, .25, .5, .75, 1].forEach(function (t) {
      raccSit.push(filmCell('sit t=' + t, function (ctx, cx, gy) {
        drawCritter(ctx, 'raccoon', 'sit', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('RACCOON — sit transition', raccSit));

    var raccRummage = [];
    [0, .25, .5, .75].forEach(function (t) {
      raccRummage.push(filmCell('rummage t=' + t, function (ctx, cx, gy) {
        drawCritter(ctx, 'raccoon', 'rummage', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('RACCOON — rummage transition', raccRummage));

    // cat
    var catWalk = [];
    for (var k = 0; k < 8; k++) {
      (function (k) {
        catWalk.push(filmCell('walk ' + k + '/8', function (ctx, cx, gy) {
          drawWalker(ctx, 'walk', k / 8, cx, gy, 1, 2);
        }));
      })(k);
    }
    out.appendChild(filmSection('CAT', catWalk));

    var catSit = [];
    [0, .25, .5, .75, 1].forEach(function (t) {
      catSit.push(filmCell('sit t=' + t, function (ctx, cx, gy) {
        drawWalker(ctx, 'sit', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('CAT — sit transition', catSit));

    var catStretch = [];
    [0, .2, .4, .6, .8, 1].forEach(function (t) {
      catStretch.push(filmCell('stretch t=' + t, function (ctx, cx, gy) {
        drawWalker(ctx, 'stretch', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('CAT — stretch transition', catStretch));

    var catGroom = [];
    [0, .25, .5, .75].forEach(function (t) {
      catGroom.push(filmCell('groom t=' + t, function (ctx, cx, gy) {
        drawWalker(ctx, 'groom', t, cx, gy, 1, 2);
      }));
    });
    out.appendChild(filmSection('CAT — groom transition', catGroom));
  }

  window.addEventListener('load', function () {
    var view = new URLSearchParams(location.search).get('view');
    if (view === 'film') {
      renderFilm();
    } else {
      renderPoses();
    }
  });
})();
</script>
</body>
</html>
