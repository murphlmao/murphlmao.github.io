<!doctype html>
<html lang="en" data-palette="alley" data-walker="on">
<head>
<meta charset="utf-8">
<title>r4 · walker filmstrip (debug, not linked)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="walker.css">
<style>
  body { padding: 8px 12px; font: 12px var(--mono); }
  h2 { font: 600 13px var(--mono); color: var(--muted); margin: 8px 0 4px; letter-spacing: .08em; text-transform: uppercase; }
  .strip { display: flex; flex-wrap: wrap; gap: 0; }
  .cell { width: 200px; }
  .cell canvas { display: block; width: 200px; height: 148px; background: var(--bg-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cell b { display: block; padding: 3px 6px; font: 400 10px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<div id="film"></div>
<script src="walker.js"></script>
<script>
(function () {
  var film = document.getElementById('film');
  var rows = [];
  var i;
  var walk = [];
  for (i = 0; i < 12; i++) walk.push(['walk', i / 12, 'walk ' + (i + 1) + '/12  φ=' + (i / 12).toFixed(2)]);
  rows.push(['walk cycle — 12 frames, one stride', walk]);
  rows.push(['trot', [['trot', 0, 'trot φ=0.00'], ['trot', 0.25, 'trot φ=0.25'], ['trot', 0.5, 'trot φ=0.50'], ['trot', 0.75, 'trot φ=0.75']]]);
  rows.push(['key poses', [
    ['sit', 1, 'sit'],
    ['look', 1, 'look at reader'],
    ['lie', 1, 'lie down'],
    ['groom', 0.230, 'groom · paw up (w=0)'],
    ['groom', 0.275, 'groom · w=0.25'],
    ['groom', 0.330, 'groom · over ear (w=.5)'],
    ['groom', 0.385, 'groom · w=0.75'],
    ['stretch', 0.40, 'stretch · bow'],
    ['stretch', 0.60, 'stretch · mid'],
    ['stretch', 0.78, 'stretch · rear up'],
    ['turn', 0.25, 'turn 0.25'],
    ['turn', 0.50, 'turn 0.50 (flip)'],
    ['turn', 0.75, 'turn 0.75']
  ]]);

  var dpr = 2;
  rows.forEach(function (row) {
    var h = document.createElement('h2'); h.textContent = row[0]; film.appendChild(h);
    var s = document.createElement('div'); s.className = 'strip'; film.appendChild(s);
    row[1].forEach(function (f) {
      var cell = document.createElement('div'); cell.className = 'cell';
      var c = document.createElement('canvas');
      c.width = 200 * dpr; c.height = 148 * dpr;
      var b = document.createElement('b'); b.textContent = f[2];
      cell.appendChild(c); cell.appendChild(b); s.appendChild(cell);
      var ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // ground hairline
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
      ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 135.5); ctx.lineTo(200, 135.5); ctx.stroke();
      window.Walker.frame(ctx, 200, 148, f[0], f[1], 1.55);
    });
  });
})();
</script>
</body>
</html>
