<!doctype html>
<html lang="en" data-palette="alley" data-mich="maize" data-draw="pen">
<head>
<meta charset="utf-8">
<title>r4 · pen mode filmstrip (debug, not linked)</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 8px 12px; font: 12px var(--mono); background: var(--bg); }
  h2 { font: 600 13px var(--mono); color: var(--muted); margin: 8px 0 4px; letter-spacing: .08em; text-transform: uppercase; }
  .strip { display: flex; flex-wrap: wrap; gap: 0; }
  .cell { width: 300px; }
  .cell canvas { display: block; width: 300px; height: 218px; background: var(--bg-2); border: 1px solid var(--line); }
  .cell b { display: block; padding: 3px 6px; font: 400 10px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<div id="film"></div>
<script src="site.js"></script>
<script>
(function () {
  var film = document.getElementById('film');
  var moments = ['25%', '60%', '100% + glow peak', 'settled'];

  ['pen', 'laser'].forEach(function (mode) {
    var h = document.createElement('h2'); h.textContent = mode; film.appendChild(h);
    var s = document.createElement('div'); s.className = 'strip'; film.appendChild(s);

    moments.forEach(function (label) {
      var cell = document.createElement('div'); cell.className = 'cell';
      var c = document.createElement('canvas'); c.dataset.scene = 'home';
      var b = document.createElement('b');
      cell.appendChild(c); cell.appendChild(b); s.appendChild(cell);

      var scene = window.Pen(c, true);
      var D = scene.dur[mode];
      var ms;
      switch (label) {
        case '25%': ms = 0.25 * D; break;
        case '60%': ms = 0.60 * D; break;
        case '100% + glow peak': ms = D + scene.glow.flash + scene.glow.hold / 2; break;
        case 'settled': ms = D + scene.glow.flash + scene.glow.hold + scene.glow.fade + 500; break;
      }
      scene.renderAt(mode, ms);
      b.textContent = label + '  ' + Math.round(ms) + 'ms';
    });
  });
})();
</script>
</body>
</html>
